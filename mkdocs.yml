site_name: Flowi Workflow Documentation
site_description: Official documentation for Flowi Workflow by AI Flowi — visual AI workflow automation, components, webhooks, Google Sheets, Telegram Bot integration, Ask AI, tutorials and troubleshooting.
site_url: https://docs.aiflowi.com/
repo_url: https://github.com/ai-flowi/flowi-docs
repo_name: ai-flowi/flowi-docs
use_directory_urls: true

copyright: Documentation for Flowi Workflow by AI Flowi

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - AI Start Here: AI_START_HERE.md
  - Getting Started:
      - Overview: getting-started/index.md
      - What is Flowi?: getting-started/what-is-flowi.md
      - Learn with ChatGPT / DeepSeek: getting-started/ai-tutor-mode.md
      - Ask an AI Assistant: getting-started/ask-ai-assistant.md
      - Workflow Basics: concepts/workflow-basics.md
  - Tutorials:
      - Overview: tutorials/index.md
      - First Playground Workflow: tutorials/first-playground-workflow.md
      - If-Else Routing: tutorials/if-else-routing.md
      - LLM Selector Routing: tutorials/llm-selector-routing.md
      - Webhook to Google Sheets: tutorials/webhook-to-google-sheets.md
  - Integrations:
      - Telegram Bot:
          - Overview: integrations/telegram/index.md
          - Telegram Webhook Setup: integrations/telegram/telegram-webhook-setup.md
          - Telegram Update Parser: integrations/telegram/telegram-update-parser.md
          - Telegram AI Bot Tutorial: integrations/telegram/telegram-ai-bot.md
          - Troubleshooting: integrations/telegram/troubleshooting.md
