site_name: AI Flowi Workflow Documentation
site_description: Official documentation for Flowi Workflow by AI Flowi — visual AI workflow automation, components, webhooks, Google Sheets, Telegram Bot integration, Ask AI, tutorials and troubleshooting.
site_url: https://aiflowi.com/docs/
repo_url: https://github.com/Aiflowi/flowi-workflow-docs
repo_name: Aiflowi/flowi-workflow-docs
use_directory_urls: true

copyright: Documentation for Flowi Workflow by AI Flowi

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - What is AI Flowi Workflow?: getting-started/what-is-flowi.md
      - Workflow Basics: concepts/workflow-basics.md
      - Learn with AI: getting-started/ai-tutor-mode.md
  - Tutorials:
      - Overview: tutorials/index.md
      - First Workflow: tutorials/first-playground-workflow.md
      - If-Else Routing: tutorials/if-else-routing.md
      - LLM Selector Routing: tutorials/llm-selector-routing.md
      - Webhook to Google Sheets: tutorials/webhook-to-google-sheets.md
  - Integrations:
      - Overview: integrations/index.md
      - Telegram: integrations/telegram/index.md
      - Telegram Webhook Setup: integrations/telegram/telegram-webhook-setup.md
      - Telegram Update Parser: integrations/telegram/telegram-update-parser.md
      - Telegram AI Bot: integrations/telegram/telegram-ai-bot.md
      - Telegram Troubleshooting: integrations/telegram/troubleshooting.md
  - Components:
      - Overview: components/index.md
      - Catalog: components/categories.md
      - Custom Components: components/custom-components.md
  - Connections:
      - Overview: connections/index.md
      - Google: connections/google-connections.md
      - Models and Variables: connections/model-providers-and-variables.md
  - Triggers:
      - Overview: triggers/index.md
      - Universal Webhook: triggers/universal-webhook.md
      - Schedule: triggers/schedule-trigger.md
      - Webhook Response: triggers/webhook-response.md
  - Ask AI: ask-ai/index.md
  - Workflow Lifecycle: workflow-lifecycle/index.md
  - Use Cases:
      - Overview: use-cases/index.md
      - AI Workflow Automation: use-cases/ai-workflow-automation.md
      - Google Sheets Automation: use-cases/google-sheets-ai-automation.md
  - Evaluate: evaluate/when-flowi-fits.md
  - FAQ: faq/index.md
  - Troubleshooting:
      - Overview: troubleshooting/index.md
      - Common Errors: troubleshooting/common-errors.md
      - Google Connections: troubleshooting/google-connections.md
      - Webhooks: troubleshooting/webhooks.md
  - AI Start Here: AI_START_HERE.md
